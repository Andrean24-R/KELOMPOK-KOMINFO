<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Member - SpeedShop JDM</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

<div class="login-box">
    <h2>Login Area</h2>
    <form id="loginForm" action="#" method="POST">
        <div class="input-group">
            <label for="username">ID Member / Username</label>
            <input type="text" id="username" name="username" required placeholder="Silahkan Masukkan Username">
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Silahkan Masukkan Password">
        </div>
        <button type="submit">LOGIN </button>
            <p>Ingin kembali?   <a href="index.html">Kembali</p></a>
        
    </form>
</div>
        <audio id="bgMusic" autoplay loop>
        <source src="son-original.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.getElementById("bgMusic").volume = 0.2; 
    </script>

<script src="JS/script.js"></script>

</body>
</html>
